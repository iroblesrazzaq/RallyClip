name: RallyClip
options:
  bundleIdPrefix: com.rallyclip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.19.0"
  # OpenCV as a prebuilt binary xcframework via SPM (device + simulator arm64),
  # so no manual framework download / build is needed.
  opencv:
    url: https://github.com/yeatse/opencv-spm
    from: "4.9.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
    CLANG_CXX_LIBRARY: "libc++"
    # Obj-C++ court detector + image ops call into Swift and vice-versa.
    SWIFT_OBJC_BRIDGING_HEADER: RallyClip/Vision/RallyClip-Bridging-Header.h
    # OpenCV headers are C++; only .mm translation units import them.
    GCC_INPUT_FILETYPE: automatic

targets:
  RallyClip:
    type: application
    platform: iOS
    sources:
      - path: RallyClip
      # The v0.3.1 model artifact + court fallback, bundled straight from the
      # tracked desktop assets so both apps ship byte-identical weights.
      - { path: ../models/rallyclip_v0.3.1/model.onnx, buildPhase: resources }
      - { path: ../models/rallyclip_v0.3.1/scaler.json, buildPhase: resources }
      - { path: ../models/rallyclip_v0.3.1/manifest.json, buildPhase: resources }
      - { path: ../models/rallyclip_v0.3.1/yolov8n-pose-544x960-static.onnx, buildPhase: resources }
      - { path: ../models/rallyclip_v0.3.1/yolov8n-pose-960-dynamic.onnx, buildPhase: resources }
      - { path: ../src/preprocessing/default_court_mask.png, buildPhase: resources }
    dependencies:
      - package: onnxruntime
      - package: opencv
        product: OpenCV
    settings:
      base:
        INFOPLIST_FILE: RallyClip/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rallyclip.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO

  RallyClipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RallyClipTests
      # Desktop golden fixture for the end-to-end parity test.
      - { path: ../tests/fixtures/golden_cli/clip.mp4, buildPhase: resources }
      - { path: ../tests/fixtures/golden_cli/golden_segments.csv, buildPhase: resources }
    dependencies:
      - target: RallyClip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rallyclip.tests

schemes:
  RallyClip:
    build:
      targets:
        RallyClip: all
        RallyClipTests: [test]
    test:
      targets:
        - RallyClipTests
    run:
      config: Debug
