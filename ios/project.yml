name: RallyClip
options:
  bundleIdPrefix: com.rallyclip
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.19.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
    CLANG_CXX_LIBRARY: "libc++"
    # Obj-C++ court detector + image ops call into Swift and vice-versa.
    SWIFT_OBJC_BRIDGING_HEADER: RallyClip/Vision/RallyClip-Bridging-Header.h
    # OpenCV headers are C++; only .mm translation units import them.
    GCC_INPUT_FILETYPE: automatic

targets:
  RallyClip:
    type: application
    platform: iOS
    sources:
      - path: RallyClip
    resources:
      # The v0.3.1 model artifact + court fallback, copied straight from the
      # tracked desktop bundle so both apps ship byte-identical weights.
      - path: ../models/rallyclip_v0.3.1/model.onnx
      - path: ../models/rallyclip_v0.3.1/scaler.json
      - path: ../models/rallyclip_v0.3.1/manifest.json
      - path: ../models/rallyclip_v0.3.1/yolov8n-pose-544x960-static.onnx
      - path: ../models/rallyclip_v0.3.1/yolov8n-pose-960-dynamic.onnx
      - path: ../src/preprocessing/default_court_mask.png
    dependencies:
      - package: onnxruntime
      - framework: Frameworks/opencv2.xcframework
        embed: false
    settings:
      base:
        INFOPLIST_FILE: RallyClip/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rallyclip.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO
