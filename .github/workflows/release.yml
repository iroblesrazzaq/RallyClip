name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: RallyClip-macos
          - os: windows-latest
            artifact: RallyClip-windows
          - os: ubuntu-latest
            artifact: RallyClip-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop,pack]"
      - name: Fetch YOLO weights
        shell: bash
        run: |
          python - <<'PY'
          from ultralytics import YOLO
          # Downloads yolov8n-pose.pt into the Ultralytics cache dir
          # (e.g. ~/.cache/ultralytics/). Not bundled by PyInstaller;
          # Ultralytics auto-downloads at runtime on first use.
          YOLO("yolov8n-pose.pt")
          print("YOLO weights downloaded to Ultralytics cache.")
          PY
      - name: Verify RallyClip model artifacts
        shell: bash
        run: |
          # Artifacts are tracked in git under models/rallyclip_v0.3.1/
          test -f models/rallyclip_v0.3.1/model.onnx
          test -f models/rallyclip_v0.3.1/scaler.json
          test -f models/rallyclip_v0.3.1/manifest.json
          test -f src/preprocessing/default_court_mask.png
      - name: Build desktop bundle
        shell: bash
        run: |
          SEP=":"
          if [ "${{ runner.os }}" = "Windows" ]; then SEP=";"; fi
          pyinstaller --noconfirm --onedir \
            --name RallyClip \
            --hidden-import=gui.app \
            --hidden-import=cli.main \
            --hidden-import=runtime.device \
            --hidden-import=runtime.defaults \
            --hidden-import=runtime.paths \
            --collect-submodules=flask \
            --collect-all=ultralytics \
            --add-data "src/gui/frontend${SEP}gui/frontend" \
            --add-data "models/rallyclip_v0.3.1${SEP}models/rallyclip_v0.3.1" \
            --add-data "src/preprocessing/default_court_mask.png${SEP}preprocessing" \
            src/gui/desktop.py
      - name: Smoke test headless CLI in bundle
        shell: bash
        run: |
          BIN="$(pwd)/dist/RallyClip/RallyClip"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi

          # 1) Frozen import chain + argparse work.
          "$BIN" --cli --help

          # 2) Frozen asset resolution: hide the repo's models/ and run from a
          #    neutral cwd so ONLY the bundled copy can satisfy resolve_asset
          #    (candidate_roots includes the checkout via cwd/parent dirs).
          #    Must fail cleanly on the missing video (exit 1, no traceback) —
          #    a broken resolution also exits 1, but with a traceback.
          mv models models_hidden
          set +e
          out=$(cd "$RUNNER_TEMP" && "$BIN" --cli --video ./missing.mp4 --no-segment-video 2>&1)
          code=$?
          set -e
          mv models_hidden models
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "video file not found"
          ! echo "$out" | grep -q "Traceback"
      - name: Archive build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell Compress-Archive -Path dist/RallyClip -DestinationPath "${{ matrix.artifact }}.zip"
            if command -v certutil >/dev/null 2>&1; then certutil -hashfile "${{ matrix.artifact }}.zip" SHA256 > "${{ matrix.artifact }}.zip.sha256"; fi
          else
            cd dist && tar -czf "../${{ matrix.artifact }}.tar.gz" RallyClip
            cd ..
            shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          fi
      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ matrix.artifact }}.*
          draft: true
          generate_release_notes: true
