[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rallyclip"
version = "0.5.0"
description = "Local tennis match segmentation — CLI and desktop app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  # Court-detection golden fixtures are validated against the 4.x algorithms;
  # bump past 5 only after re-checking tests/test_court_detection_deterministic.
  "opencv-python>=4.8,<5",
  "av",
  "tqdm",
  "tomli>=2.0.1",
  "Flask>=2.3",
  "flask-cors>=4.0",
]

[project.optional-dependencies]
# Training pipeline + .pt weights. The shipped runtime is torch-free: pose
# runs on the bundled ONNX via onnxruntime (extraction.yolo_onnx_runner).
# HDF5 / YAML / W&B / sklearn / joblib live here, not on the GUI install.
train = [
  "torch",
  "ultralytics",
  "h5py",
  "pyyaml",
  "joblib",
  "scikit-learn>=1.7.1",
  "wandb",
  "jsonschema",
]
# Mutually exclusive ONNX Runtime wheels (same import name). Never install
# [cpu] and [gpu] together — the CPU package wins on import and hides CUDA.
cpu = [
  "onnxruntime",
]
# NVIDIA CUDA pose/LSTM via onnxruntime's CUDA EP. Match the wheel to your
# CUDA toolkit/driver; see docs/ENVIRONMENT.md.
gpu = [
  "onnxruntime-gpu",
]
dev = [
  "pytest",
  "requests",
  # Training unit tests import HDF5/YAML/joblib/sklearn modules without torch.
  "h5py",
  "pyyaml",
  "joblib",
  "scikit-learn>=1.7.1",
]
# Browser-driven L2 e2e (frontend journey). Heavy (downloads a browser); kept
# separate so the core dev/test install stays light. Install the browser with
# `playwright install chromium` after `uv sync --extra cpu --extra e2e-ui`.
e2e-ui = [
  "playwright>=1.40",
  "pytest-playwright>=0.4",
]
# System-webview shell (WKWebView on macOS, WebView2 on Windows): no bundled
# browser engine. The old QtWebEngine/PySide6 shell shipped ~470MB of Qt.
# Does not include onnxruntime — pair with [cpu] (Mac/CPU) or [gpu] (NVIDIA).
desktop = [
  "pywebview>=5.0",
]
pack = [
  "pyinstaller>=6.0",
]

[project.scripts]
rallyclip = "cli:main"
rallyclip-desktop = "gui.desktop:main"

[tool.uv]
# onnxruntime and onnxruntime-gpu share an import path; installing both
# silently hides CUDA. uv needs this declared so `uv sync --extra cpu`
# and `uv sync --extra gpu` resolve as separate forks.
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running tests (heavy I/O or model loads)",
  "e2e: end-to-end tests needing source videos / model weights",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the empirical default court mask used as the detection fallback.
preprocessing = ["*.png"]
gui = [
  "frontend/index.html",
  "frontend/styles.css",
  "frontend/script.js",
]
