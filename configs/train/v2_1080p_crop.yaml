# Treatment for the far-crop experiment: v2 features (redundancy-pruned, 145/slot)
# WITH the two far-crop slots -> 580 dims, on the 1080p 26-video corpus.
#
# This exists so the crop run has a like-for-like comparison. The 720p champion
# (42.1%) is NOT comparable: different corpus, different test videos, different
# feature set.
run_id: 20260725_v2crop_1080p
data_root: /Users/ismaelrobles-razzaq/2_cs_projects/rallyclip_container/training_data_1080p
normalize:
  width: 1920
  height: 1080
  fps: 5
court:
  enabled: true
features:
  feature_set: v2
train:
  head: e2e_heatmap
  heatmap_backbone: tcn
  hidden_size: 64
  heatmap_tcn_levels: 5
  heatmap_tcn_kernel_size: 3
  dropout: 0.2
  lr: 0.0001
  lr_schedule: cosine
  lr_eta_min: 0.0
  epochs: 30
  early_stopping_patience: 30
