data_root: data
run_id: null
steps:
  - normalize
  - extract
  - preprocess
  - features
  - dataset
  - train
  - eval
videos: []
overwrite_all: false

normalize:
  width: 1280
  height: 720
  fps: 5
  mode: annotated
  videos: []
  source_dir: source_videos  # originals; normalized copies land in videos/norm=<WxH@fps>/
  overwrite: false

yolo:
  # Manifest-backed ONNX backend: identity (name@sha8), imgsz, letterbox and
  # decode contract all come from the manifest. Same model family the desktop
  # and (future) iOS apps run. provider=coreml uses the static 544x960 sibling
  # on the ANE (~90 fps, sub-pixel parity vs cpu); EP is provenance, not identity.
  model: models/pose/yolov8n/manifest.json
  provider: coreml
  conf: 0.25
  model_dir: models
  device: null
  batch_size: null

extract:
  mode: annotated
  videos: []
  start_time: 0
  duration: null
  sampling_mode: full_then_downsample  # video is already 5fps after normalize
  sample_fps: null
  overwrite: false
  resume: true

preprocess:
  target_fps: 5
  save_court_masks: true
  mode: annotated
  videos: []
  overwrite: false

court:
  model_path: null
  target_time: 60
  force: false

features:
  feature_set: v1
  mode: annotated
  videos: []
  overwrite: false

dataset:
  seq_len_seconds: 20
  overlap_seconds: 10
  split:
    strategy: hybrid  # options: hybrid, by_video, within_video, loso_temporal_val
    seed: 67
    test_videos: []  # for loso_temporal_val: set exactly one held-out video per run
    val_ratio: 0.1
    test_ratio: 0.1
  mode: annotated
  videos: []

train:
  head: classic  # classic | e2e_seg
  seed: 1337
  batch_size: 8
  train_batch_size: 8
  eval_batch_size: 8
  grad_accum_steps: 1
  num_workers: 0
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  pos_weight: null  # null => derive from train positive rate
  device: mps
  threshold: 0.5
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001
  save_every_n: 0
  hidden_size: 128
  num_layers: 2
  bidirectional: true
  dropout: 0.2
  # e2e_seg knobs (ignored by classic head)
  selection_metric: acceptable  # val_loss | acceptable | good_weighted
  cls_weight: 1.0
  boundary_weight: 1.0
  diou_weight: 0.25
  decode_vote: mean
  segment_eval:
    low: 0.45
    high: 0.8
    sigma: 1.5
    min_dur_sec: 0.5

wandb:
  enabled: false
  project: rallyclip-cv
  entity: isi_uchicago_neurotech
  group: null
  tags: []

postprocess_eval:
  run_prefix: loso_nano_mps_e30
  device: cpu
  iou_threshold: 0.5
  datasets: []
  fps_values: []
  seq_len_seconds: [10]
  weights:
    coverage: 0.4
    segment_recall: 0.4
    specificity: 0.2

sweep:
  enabled: true
  run_prefix: loso_nano_mps_e30
  resume: true
  fps_values: [5]
  seq_len_seconds: [10]
  overlap_mode: half_seq_len
  overlap_seconds: null  # only used when overlap_mode: fixed
  steps_precompute: [preprocess, features]
  steps_per_fold: [dataset, train, eval]
  loso:
    mode: annotated
    videos: []
    val_ratio: 0.1
    seed: 67
  datasets:
    mode: manual
    require_all_videos: true
    entries:
      - name: yolon960
        yolo:
          model: yolov8n-pose.pt
          conf: 0.25
          imgsz: 960
        extract:
          sampling_mode: full_then_downsample
          sample_fps: null
      - name: yolon1440
        yolo:
          model: yolov8n-pose.pt
          conf: 0.25
          imgsz: 1440
        extract:
          sampling_mode: full_then_downsample
          sample_fps: null
