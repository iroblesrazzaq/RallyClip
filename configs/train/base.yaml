data_root: data
run_id: null
steps:
  - extract
  - preprocess
  - features
  - dataset
  - train
  - eval
videos: []
overwrite_all: false

yolo:
  model: yolov8n-pose.pt
  conf: 0.25
  imgsz: 1920
  model_dir: models
  device: null
  batch_size: null

extract:
  mode: annotated
  videos: []
  start_time: 0
  duration: null
  sampling_mode: full_then_downsample  # or: downsample_then_extract
  sample_fps: null
  overwrite: false
  resume: true

preprocess:
  target_fps: 15
  save_court_masks: true
  mode: annotated
  videos: []
  overwrite: false

court:
  model_path: null
  target_time: 60
  force: false

features:
  feature_set: v1
  mode: annotated
  videos: []
  overwrite: false

dataset:
  seq_len_seconds: 20
  overlap_seconds: 10
  split:
    strategy: hybrid  # options: hybrid, by_video, within_video, loso_temporal_val
    seed: 67
    test_videos: []  # for loso_temporal_val: set exactly one held-out video per run
    val_ratio: 0.1
    test_ratio: 0.1
  mode: annotated
  videos: []

train:
  batch_size: 8
  train_batch_size: 8
  eval_batch_size: 8
  grad_accum_steps: 1
  num_workers: 0
  epochs: 30
  lr: 0.001
  weight_decay: 0.01
  pos_weight: 3.0
  device: mps
  threshold: 0.5
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001
  save_every_n: 0
  segment_eval:
    low: 0.45
    high: 0.8
    sigma: 1.5
    min_dur_sec: 0.5

wandb:
  enabled: false
  project: rallyclip-cv
  entity: isi_uchicago_neurotech
  group: null
  tags: []

postprocess_eval:
  run_prefix: loso_nano_mps_e30
  device: cpu
  iou_threshold: 0.5
  datasets: []
  fps_values: []
  seq_len_seconds: [10]
  weights:
    coverage: 0.4
    segment_recall: 0.4
    specificity: 0.2

sweep:
  enabled: true
  run_prefix: loso_nano_mps_e30
  resume: true
  fps_values: [10, 5]
  seq_len_seconds: [10]
  overlap_mode: half_seq_len
  overlap_seconds: null  # only used when overlap_mode: fixed
  steps_precompute: [preprocess, features]
  steps_per_fold: [dataset, train, eval]
  loso:
    mode: annotated
    videos: []
    val_ratio: 0.1
    seed: 67
  datasets:
    mode: manual
    require_all_videos: true
    entries:
      - name: yolon960
        yolo:
          model: yolov8n-pose.pt
          conf: 0.25
          imgsz: 960
        extract:
          sampling_mode: full_then_downsample
          sample_fps: null
      - name: yolon1440
        yolo:
          model: yolov8n-pose.pt
          conf: 0.25
          imgsz: 1440
        extract:
          sampling_mode: full_then_downsample
          sample_fps: null
