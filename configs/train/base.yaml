data_root: data
run_id: null
steps:
  - extract
  - preprocess
  - features
  - dataset
  - train
  - eval

yolo:
  model: yolov8s-pose.pt
  conf: 0.25
  model_dir: models
  device: null
  batch_size: null

extract:
  mode: annotated
  videos: []
  start_time: 0
  duration: null
  overwrite: false
  resume: true

preprocess:
  target_fps: 15
  save_court_masks: true
  mode: annotated
  videos: []
  overwrite: false

court:
  model_path: yolov8s.pt
  target_time: 60
  force: false

features:
  feature_set: v1
  mode: annotated
  videos: []
  overwrite: false

dataset:
  seq_len_seconds: 20
  overlap_seconds: 10
  split:
    strategy: hybrid
    seed: 1337
    test_videos: []
    val_ratio: 0.1
    test_ratio: 0.1
  mode: annotated
  videos: []

train:
  batch_size: 32
  epochs: 50
  lr: 0.001
  checkpoint_metric: balanced_accuracy

wandb:
  enabled: false
  project: null
  entity: null
