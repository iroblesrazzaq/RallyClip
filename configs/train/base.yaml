data_root: data
run_id: null
steps:
  - extract
  - preprocess
  - features
  - dataset
  - train
  - eval
videos: []
overwrite_all: false

yolo:
  model: yolov8s-pose.pt
  conf: 0.25
  imgsz: 1920
  model_dir: models
  device: null
  batch_size: null

extract:
  mode: annotated
  videos: []
  start_time: 0
  duration: null
  sampling_mode: full_then_downsample  # or: downsample_then_extract
  sample_fps: null
  overwrite: false
  resume: true

preprocess:
  target_fps: 15
  save_court_masks: true
  mode: annotated
  videos: []
  overwrite: false

court:
  model_path: null
  target_time: 60
  force: false

features:
  feature_set: v1
  mode: annotated
  videos: []
  overwrite: false

dataset:
  seq_len_seconds: 20
  overlap_seconds: 10
  split:
    strategy: hybrid  # options: hybrid, by_video, within_video, loso_temporal_val
    seed: 1337
    test_videos: []  # for loso_temporal_val: set exactly one held-out video per run
    val_ratio: 0.1
    test_ratio: 0.1
  mode: annotated
  videos: []

train:
  batch_size: 32
  epochs: 50
  lr: 0.001
  weight_decay: 0.01
  pos_weight: 3.0
  device: null
  threshold: 0.5
  save_every_n: 0
  segment_eval:
    low: 0.45
    high: 0.8
    sigma: 1.5
    min_dur_sec: 0.5

wandb:
  enabled: true
  project: rallyclip-cv
  entity: isi_uchicago_neurotech
  group: null
  tags: []

sweep:
  enabled: true
  run_prefix: cv
  resume: true
  fps_values: [15, 10, 7, 6, 5, 4, 3, 2, 1]
  seq_len_seconds: [10, 20, 30]
  steps_precompute: [preprocess, features]
  steps_per_fold: [dataset, train, eval]
  loso:
    mode: annotated
    videos: []
    val_ratio: 0.1
    seed: 67
  datasets:
    mode: auto
    require_all_videos: true
    entries: []
    # entries example for manual mode:
    # - name: yolos960
    #   yolo:
    #     model: yolov8s-pose.pt
    #     conf: 0.25
    #     imgsz: 960
    #   extract:
    #     sampling_mode: full_then_downsample
    #     sample_fps: null
