[run]
# Required paths  - can also set with CLI args:
video_path = "output_videos/Set_1_Play_Uncut_Derek_vs._Alex_short_segmented.mp4"
output_dir = "output_videos"

# Optional custom output base name - otherwise just "[video_name]_segmented.mp4"
# output_name = "match1"

# Write outputs
write_csv = true
segment_video = true
csv_output_dir = "output_csvs" # defaults to input video directory

# YOLO pose model choice: nano | small | medium | large
yolo_model = "nano"
# Optional device: cpu | cuda | mps (defaults to auto; set to "mps" for Apple Silicon)
yolo_device = "mps" # get mps warning so switches to cpu if don't set this var

# Primary inference artifact: manifest + ONNX + scaler JSON
artifact_dir = "models/rallyclip_v0.3.0"

# Legacy compatibility only:
# model_path = "/path/to/model.pth"
# scaler_path = "/path/to/scaler.joblib"

# Inference defaults now come from the artifact manifest.
# Leave these unset unless you are intentionally overriding the artifact:
# fps = 5.0
# seq_len = 100
# overlap = 50
# sigma = 1.0
# low = 0.45
# high = 0.7
# min_dur_sec = 1.0

# Runtime extraction controls
conf = 0.25
start_time = 0
duration = 999999
